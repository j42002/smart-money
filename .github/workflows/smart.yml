name: smart
on:
  schedule:
    # off-the-hour minutes; GitHub drops/delays a lot of */15 jobs at :00
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: ["claude/**"]   # dry run on dev branches, no data commit
permissions:
  contents: write
concurrency:
  group: smart-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: scan
        run: python smart.py scan
      - name: grade
        run: python smart.py grade
      - name: commit data
        # only main keeps the ledger; branch runs are dry runs (results in the log)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "smart-money-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
